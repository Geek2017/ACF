# macOS. The same file runs a Mac's fleet; this block only changes what a Mac does differently, and
# comes last so that it wins. Alt+X names the tab after the pane's folder without /proc. Copy needs
# nothing here: afc-copy (the copy-command above) hands a Mac's copies to pbcopy by itself, so the
# clean copy works there too. For the Alt keys Terminal must send Option as Meta:
# Terminal > Settings > Profiles > Keyboard > "Use Option as Meta key".
if-shell '[ "$(uname -s)" = Darwin ]' {
  bind -n M-x break-pane \; run-shell 'tmux rename-window "#{b:pane_current_path}"'
}

# Windows (WSL2) needs no block of its own any more. afc-copy sends a copy to the WINDOWS clipboard
# through clip.exe, so it can be pasted into any Windows program (it used to be copy-command
# 'clip.exe' here, which skipped the cleaning and turned every non-ASCII character into mojibake).
