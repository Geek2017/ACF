# tmux — keeps agent sessions alive when the terminal window closes.
# Fleet launcher: `agents` (~/.local/bin/agents). Reload this file: Ctrl+B then R.

# The checklist of steps an agent keeps while it works, as in the Claude app. Claude Code's CLI has its
# task list (TaskCreate, TaskUpdate; Ctrl+T shows or hides it) switched off for the newer models unless
# this is set, so every pane of the fleet gets it. Codex (update_plan), Gemini (write_todos) and
# Antigravity (task.md) have theirs on already. An agent started before this was set needs a restart.
set-environment -g CLAUDE_CODE_ENABLE_TODO_TOOLS 1

# Mouse: click tabs in the bottom bar, wheel to scroll, drag to select (copies to clipboard)
set -g mouse on
set -s set-clipboard on

# Tabs number from 1; Alt+1..9 jumps straight to a tab, Alt+0 = tab 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
# Alt+0 on a council pane switches its view like Alt+O (people read the O as a zero); elsewhere: tab 10
bind -n M-0 if -F '#{@council_chat}' { send-keys M-o } { if -F '#{@council_member}' { run-shell -b '~/.local/bin/tmux -S "#{socket_path}" send-keys -t "#{@council_chair}" M-o' } { select-window -t :=10 } }

# New tab / split open in the current project folder
bind c run-shell 'tmux new-window -t "#{session_name}:" "~/.local/bin/agents --pane tab #{pane_pid}"'
bind '"' run-shell 'tmux split-window -v -t "#{pane_id}" "~/.local/bin/agents --pane term #{pane_pid}"'
bind % run-shell 'tmux split-window -h -t "#{pane_id}" "~/.local/bin/agents --pane term #{pane_pid}"'
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Split screen: Alt+\ splits to the right, Alt+- splits the focused pane top/bottom (new one below).
# Both open a menu asking what goes in the new pane: Claude, Gemini or Codex, each fresh / plan /
# bypass (keys c p b, g h i, x y z; Codex's "plan" is read-only, Shift+Tab inside it for its Plan
# mode), Claude on another account (o: pick the account, then the mode), an agent from another tab,
# or a plain terminal. A right split takes the full height at the right edge (-f); every new pane
# opens in this project's folder. `agents --split-menu` / `--split-down` build the menu, so it can
# show which Claude account c p b start on. Columns and stacks are evened with ~/.local/bin/afc-even,
# which leaves top/bottom splits in place. Not tmux's own select-layout -E: in 3.8 it leaves a
# top/bottom stack out of a row's count and pushes it past the tab's right edge, out of sight.
# Alt+S shows another tab on the right (type its number); Alt+X sends the focused pane back to
# its own tab; Alt+Z zooms the focused pane and back.
bind -n 'M-\' run-shell -b '~/.local/bin/agents --split-menu "#{client_name}" "#{pane_id}" "#{pane_pid}"'
bind -n M-- run-shell -b '~/.local/bin/agents --split-down "#{client_name}" "#{pane_id}" "#{pane_pid}"'
# Alt+E: this project's tab on or off the express lane (agents-express.slice: first call on the fleet's
# CPU and its memory kept when the fleet is busy; the fleet's own total is unchanged). ⚡ in the header.
bind -n M-e run-shell -b '~/.local/bin/agents --lane-toggle "#{client_name}" "#{window_id}" "#{pane_pid}"'
bind -n M-s command-prompt -p "Show tab # on the right:" "join-pane -fh -s ':%%' ; run-shell -b '~/.local/bin/afc-even --window \"#{window_id}\"'"
bind -n M-x break-pane \; run-shell 'tmux rename-window "$(basename "$(readlink /proc/#{pane_pid}/cwd)")"'
bind -n M-z resize-pane -Z
# Alt+Q: close the focused split, then even out its row or column. It asks first, in a small
# Yes / No pop-up in the centre of the window like the fleet's other menus (it used to ask on the
# bottom line): y or a click on Yes closes; m minimises it instead (it keeps running, Alt+U brings
# it back; greyed out on a tab's only pane); n, Esc, Enter or a click on No leaves it alone. On a
# project tab's last pane it closes the project for good: `agents --close` takes it off the list.
# A split is never left out of sight: when tmux cannot show one (past the tab's edge), afc-reflow,
# run on every layout change, has afc-even --guard share the tab out again or minimise it.
# (Alt+O, Alt+P, Alt+T and Alt+W are left alone: Claude Code uses them.)
bind -n M-q if -F '#{@council_one}' { run-shell -b '~/.local/bin/afc-council --one-menu "#{client_name}" "#{pane_id}"' } { if -F '#{@council_perm_judge}' { display-menu -M -x C -y C -T "#[align=centre] 🔒 @#{?#{@council_name},#{@council_name},supra-omnia} is the permanent final judge " "Switch Judge provider & model…" m "run-shell -b '~/.local/bin/afc-council --open-settings \"#{client_name}\" \"#{window_id}\" bp_role:JUDGE'" "" "Close menu" n "" } { display-menu -M -x C -y C -T "#[align=centre] #{?#{@council_chat},Close the council? (saved: Alt+K opens it again),#{?#{@council_member},#{?#{@council_one},Back to one pane per member?,#{?#{@council_what},#{@council_what},Remove} @#{?#{@council_name},#{@council_name},#{@council_member}}#{?#{==:#{@council_what},Delete agent}, for good,} from the council?},#{?#{&&:#{==:#{window_panes},1},#{@project}},Close #{@project} for good (off the fleet list)?,Close this split?}}} " "Yes, close it" y "run-shell '~/.local/bin/agents --close #{pane_id}'" "#{?#{||:#{@council_chat},#{||:#{@council_member},#{==:#{window_panes},1}}},-,}Minimise it instead" m "run-shell -b '~/.local/bin/afc-min hide #{pane_id}'" "No, keep it" n "" } }
# Alt+C: new tab with a plain terminal in this project's folder, named after the folder
bind -n M-c run-shell 'tmux new-window -t "#{session_name}:" "~/.local/bin/agents --pane tab #{pane_pid}"'

# Ctrl+V pastes whatever is on the clipboard, like Windows: text as text, an image as an image
# (handed to Claude as its own Ctrl+V). Alt+V always sends a raw Ctrl+V to the app.
bind -n C-v run-shell -b '~/.local/bin/agents --paste #{pane_id} #{socket_path}'
bind -n M-v send-keys C-v

# Ctrl+A in an agent's chat box (Claude, Codex, Gemini, Copilot, Antigravity, OpenCode) selects
# everything typed there, highlighted: then Backspace/Delete deletes it, Ctrl+X cuts, Ctrl+C copies,
# typing replaces it, Esc leaves it (~/.local/bin/afc-select). Anywhere else (a shell, an editor),
# in copy mode, and in a council's chat (which selects by itself), Ctrl+A goes on as before.
bind -n C-a if -F '#{||:#{@council_chat},#{pane_in_mode}}' { send-keys C-a } { run-shell -b 'P="#{pane_id}"; C="#{pane_current_command}"; PID="#{pane_pid}"; case "$C" in bash|zsh|sh|fish) if [ -d "/proc/$PID/task" ] && [ -z "$(cat /proc/$PID/task/*/children 2>/dev/null)" ]; then tmux send-keys -t "$P" C-a; exit 0; fi ;; vim|nvim|vi|nano|emacs|less|more|man) if [ "#{alternate_on}" = 1 ]; then tmux send-keys -t "$P" C-a; exit 0; fi ;; esac; exec ~/.local/bin/afc-select start "$P" "#{client_name}" "#{pane_in_mode}" "#{cursor_x}" "#{cursor_y}" "$PID" "#{alternate_on}" "$C" "#{pane_width}"' }

# Alt+N: pick (or create) a project folder in a KDE dialog; it joins the fleet with Claude running
bind -n M-n run-shell -b "$HOME/.local/bin/agents --pick >/dev/null 2>&1"

# Alt+M: pick the model of the agent in the focused pane from a tmux pop-up (afc-model-menu).
# Claude panes: models and effort, typed as "/model <id>" / "/effort <level>". Claude's own picker
# (/model, Alt+P) is a tall menu drawn inside the chat; it pushes the text up and leaves empty rows
# when it closes, which this pop-up avoids. Gemini panes: Argon, Carbon, Hydrogen and 3.8 Flash,
# typed as "/model set <id>", since Gemini's own picker does not list Argon or Carbon. For a pane
# sitting at its prompt; anything already typed there would be sent along with it.
bind -n M-m run-shell -b '~/.local/bin/afc-model-menu "#{client_name}" "#{pane_id}" "#{pane_pid}"'

# Alt+G: change the agent in the focused pane (e.g. when one hits its usage limit): another Claude
# account (restarts there in the same chat, and new agents start there too), or Gemini / Codex
# (a fresh chat in the same folder). Each pane's header shows that pane's agent and account.
# List / sign in Claude accounts: agents --accounts, agents --as <name>. (Not Alt+A: WeChat's screenshot key.)
bind -n M-g run-shell -b '~/.local/bin/agents --account-menu "#{client_name}" "#{pane_id}" "#{pane_pid}"'

# Alt+L: the whole fleet in one list. Every agent with its tab, whether it is working, waiting for
# you or done, and its header figures; picking a line goes to that split (a minimised one comes
# back). `agents --overview` prints the same list in any terminal.
bind -n M-l run-shell -b '~/.local/bin/agents --overview-menu "#{client_name}"'

# Alt+I: the code view (afc-ide) of this pane's folder, full screen (a popup over the whole window,
# no border): the code on the left, its files on the right. View, edit and delete only. Ctrl+Q
# closes it. The folder goes in as the start directory (-c), not through the shell, so a path with
# "$" in it stays whole. afc-ide --open opens the popup itself: it needs the client's name (a popup
# keeps the size it opened with, so the view reopens itself when the window grows), and run-shell
# fills that in where a popup's own command would not.
bind -n M-i run-shell -b -c '#{pane_current_path}' '~/.local/bin/afc-ide --open "#{client_name}"'

# Alt+K: the council. A new tab with a group chat of every signed-in LLM (Claude, Codex, Gemini,
# Antigravity) and the agents you make, in the folder of the pane you were in: tag with @name, one
# by one (/mode order) or all at once and then roasting each other (/mode roast). See afc-council.
# Not Ctrl+C: that stops the program in a pane, and every agent and terminal needs it.
bind -n M-k run-shell -b '~/.local/bin/afc-council --open "#{session_name}" "#{pane_pid}"'
# Alt+Shift+K: a council about no project, in an empty folder of its own (~/Council), so its members
# have no project's files to read or, in edit or bypass, to change
bind -n M-K run-shell -b '~/.local/bin/afc-council --open-general "#{session_name}"'
# Alt+O in a council tab, from any of its panes (the one view, a member's pane): one view for everyone, or
# one pane per member. Typed into the chat box, which keeps what you had typed. Elsewhere it goes through.
# Alt+A on any council pane: the + add menu (another seat, a new agent, remove everyone);
# elsewhere (including a coding pane sharing a project tab with a council split) it goes through.
bind -n M-a if -F '#{||:#{@council_chat},#{@council_member}}' { run-shell -b '~/.local/bin/afc-council --add-menu "#{client_name}" "#{window_id}"' } { send-keys M-a }
# The chat box's other keys, from any council pane (chat box, one view, or member pane): Alt+T a new
# topic, Alt+P the permission, Shift+Tab the mode, Alt+O the view. Checked per-pane (not window @council)
# so a Claude Code split in the same project tab keeps its own Shift+Tab / Alt+P / Alt+O / Alt+T.
bind -n M-t if -F '#{@council_chat}' { send-keys M-t } { if -F '#{@council_member}' { run-shell -b '~/.local/bin/tmux -S "#{socket_path}" send-keys -t "#{@council_chair}" M-t' } { send-keys M-t } }
bind -n M-p if -F '#{@council_chat}' { send-keys M-p } { if -F '#{@council_member}' { run-shell -b '~/.local/bin/tmux -S "#{socket_path}" send-keys -t "#{@council_chair}" M-p' } { send-keys M-p } }
# Gemini and Antigravity splits (@btab) go through agents --btab, which adds bypass to their cycle.
bind -n BTab if -F '#{@council_chat}' { send-keys BTab } { if -F '#{@council_member}' { run-shell -b '~/.local/bin/tmux -S "#{socket_path}" send-keys -t "#{@council_chair}" BTab' } { if -F '#{@btab}' { run-shell '~/.local/bin/agents --btab "#{pane_id}"' } { send-keys BTab } } }
bind -n M-o if -F '#{@council_chat}' { send-keys M-o } { if -F '#{@council_member}' { run-shell -b '~/.local/bin/tmux -S "#{socket_path}" send-keys -t "#{@council_chair}" M-o' } { send-keys M-o } }
bind -n M-O if -F '#{@council_chat}' { send-keys M-o } { if -F '#{@council_member}' { run-shell -b '~/.local/bin/tmux -S "#{socket_path}" send-keys -t "#{@council_chair}" M-o' } { send-keys M-O } }
# Meta+Alt+Q (Super+Alt+Q via Alacritty user-keys[1], or Alt+Shift+Q fallback): end council & remove/delete all members in one shot
# Meta+Alt+R (Super+Alt+R via Alacritty user-keys[2], or Alt+Shift+R fallback): reset & restart conversation wiping memory (keeps members)
bind -n M-Q if -F '#{||:#{@council_chat},#{@council_member}}' { run-shell -b '~/.local/bin/afc-council --end-all "#{window_id}" "#{pane_id}"' } { send-keys M-Q }
bind -n M-R if -F '#{||:#{@council_chat},#{@council_member}}' { run-shell -b '~/.local/bin/afc-council --restart-wipe "#{window_id}" "#{pane_id}"' } { send-keys M-R }

# Mouse copy: drag, double-click (word) or triple-click (line) selects inside the pane with tmux,
# even over Claude, and letting go puts it on the desktop clipboard through xclip (Ctrl+V in the
# browser). Claude's own drag-select copied fragments inside tmux, and Alacritty's clipboard
# handoff fails now and then. Shift+drag still gives Alacritty's own selection (Ctrl+Shift+C),
# which is the screen exactly as shown.
# What lands on the clipboard is plain text: ~/.local/bin/afc-copy takes off the agent's dressing
# (quote bar, reply and tool marks, the left margin), joins the lines that only the pane's width
# broke, and hands the result to xclip. Short lines of code, list items and tables keep their breaks.
set -s copy-command '~/.local/bin/afc-copy'
# -C on the mouse copies: tmux does not also write the terminal's clipboard. With both writers
# (xclip and the terminal) one lost the race now and then, and Alacritty put a warning bar over
# the fleet: "Unable to store text in clipboard: Failed to set new owner of XCB selection".
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel -C
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel -C
bind -T copy-mode    DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel -C
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d 0.3 \; send -X copy-pipe-and-cancel -C
bind -T copy-mode    TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel -C
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run -d 0.3 \; send -X copy-pipe-and-cancel -C
bind -n MouseDrag1Pane if -F '#{pane_in_mode}' { send -M } { copy-mode -M }
bind -n DoubleClick1Pane select-pane -t = \; if -F '#{pane_in_mode}' { send -M } { copy-mode -H ; send -X select-word ; run -d 0.3 ; send -X copy-pipe-and-cancel -C }
bind -n TripleClick1Pane select-pane -t = \; if -F '#{pane_in_mode}' { send -M } { copy-mode -H ; send -X select-line ; run -d 0.3 ; send -X copy-pipe-and-cancel -C }

# Long copy, for text that runs past one screen: Ctrl+click where it starts, scroll (wheel
# or scrollbar), then Ctrl+click where it ends. Everything in between is
# highlighted and put on the clipboard. Ctrl+click again to move the end; Esc or q finishes.
# (Ctrl, not Shift: Alacritty keeps Shift+mouse for its own selection and never passes it on.)
# scroll-exit-off does two jobs: sent from a click it first moves the cursor to that click, and
# it turns off "leave copy mode at the bottom", so scrolling down to the last line keeps the
# start. ~/.local/bin/afc-longcopy then sets the start or builds the selection; it keeps the
# start in the pane option @lc_start, which the hook clears when the pane leaves copy mode.
# A full-screen agent that reads the mouse itself still gets its Ctrl+click.
bind -n C-MouseDown1Pane select-pane -t = \; if -F '#{pane_in_mode}' { send -X scroll-exit-off ; run-shell '~/.local/bin/afc-longcopy "#{pane_id}"' } { if -F '#{mouse_any_flag}' { send -M } { copy-mode -t = ; send -X scroll-exit-off ; run-shell '~/.local/bin/afc-longcopy "#{pane_id}"' } }
set-hook -g pane-mode-changed "if -F '#{==:#{pane_in_mode},0}' 'set -pqu @lc_start'"

# History per tab (tmux holds it, not the terminal)
set -g history-limit 50000

# Scrollbar on the right edge of every pane: drag the slider, or click above / below it, to move
# through the chat; the wheel does the same. Needs tmux 3.6 or newer (the fleet runs the 3.8 in
# ~/.local/opt/tmux-3.8 through ~/.local/bin/tmux); -q keeps an older tmux from complaining.
# It only has something to scroll because Claude runs in classic mode ("tui": "default" in
# ~/.claude/settings.json), which leaves the chat in tmux's history. A full-screen agent keeps
# its chat to itself and the bar stays empty for that pane.
setw -gq pane-scrollbars on
setw -gq pane-scrollbars-position right
# Thin slider. Stock tmux can only fill a whole character cell with the slider colour. The 3.8
# in ~/.local/opt/tmux-3.8 carries a small patch (afc-thin-scrollbar.patch, kept beside it; the
# unpatched binary is bin/tmux-stock): when @scrollbar-slider holds one character, the slider is
# drawn as that character in the slider colour. Left-edge blocks, thinnest first: ▏ ▎ ▍ ▌
# (1/8, 1/4, 3/8, 1/2 of a cell). Change it here and reload (Ctrl+B then R); no restart needed.
# The track takes the pane's own background, so only the slider shows. pad=1 leaves one empty
# column between the chat and the bar, so the bar never touches the chat's input box lines.
setw -gq @scrollbar-slider "▎"
# The same patch stops the bar short of the pane's bottom: this many rows are left empty, so the
# bar ends above Claude's input box (rule, prompt, rule, mode line = 4 rows) instead of running
# beside it. Raise it if the box is taller; 0 = full height. Reload applies it, no restart.
setw -gq @scrollbar-bottom-margin 6
setw -gq pane-scrollbars-style "bg=default,fg=#7aa2f7,width=1,pad=1"

# Colours, fast Esc, focus events, and Shift+Enter etc. passed through to Claude
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:extkeys,xterm-256color:RGB:extkeys,xterm-kitty:RGB:extkeys"
set -s extended-keys on
set -s escape-time 10
set -g focus-events on

# Tab names stay as the project names
set -g allow-rename off
setw -g automatic-rename off

# Bottom bar: tabs on the left, Prev / Next buttons on the right. The AFC bar (agent,
# limits, machine, fleet memory) is in the pane header, set further down.
# Tab signals (set by Claude Code hooks through `agents --mark`, see ~/.claude/settings.json):
#   name underlined = an agent in that tab is working; it goes away when all of them finish
#   tab blinks amber = an agent finished there and you have not looked at the tab yet
# Stays at 5s when idle (matches afc-bar's cache TTL, avoids 1-second fork churn) and drops to 1s
# only while a tab has @unseen so the amber blink ticks every second.
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
# The label at the left: the fleet's session is called "agents" inside tmux (the launcher depends on
# that name, so the session itself is not renamed); it is shown as ACF. Any other session shows its own name.
# Clicking the badge opens the tabbed ACF popup menu (Commands | Sessions | Config | About).
set -g status-left "#[range=user|acf_menu]#{?#{==:#{@hov},acf_menu},#[bg=#89b4fa#,fg=#1a1b26#,bold],#[bg=#7aa2f7#,fg=#1a1b26#,bold]} #{?#{==:#{?session_grouped,#{session_group},#S},agents},ACF,#{?session_grouped,#{session_group},#S}} #[norange,default] #[fg=#565f89]|#[default]"
# A dim | after the label and between the tabs (each tab already carries a space either side).
# The tabs, and their dropdown. Each tab is drawn as before (@tab_fmt, @tab_cur_fmt; the | between
# two tabs is part of the tab, so it can go away with it). The dropdown takes the row's place only
# when the WINDOW is narrow: @tabs_room, the columns left for tabs (the client's width less what the
# bar's left and right parts take), is under 52, and the tabs do not fit in it (@tabs_squeezed).
# Then only the current tab is drawn, as a button: " ▾ 5 OMS-MODERN · 5 tabs", with ● when a tab
# you are not looking at has news; a click opens the list of tabs (agents --tab-menu). A window of
# normal width keeps the row however many tabs there are: more than fit scroll, as tmux does it
# (< and > at the ends), and ◀ ▶ move along them. Not "whenever they do not fit": a sixth tab
# then collapsed the row in a wide window (2026-11-24). Alt+1..9 and ◀ ▶ work in both.
# The 58 is the label, the two tab buttons and the figures; it was 46 until the figures gained the
# disk and the fleet's own CPU ("|D:95%" and " C:40%", 12 columns).
set -g @tabs_room '#{e|-:#{client_width},#{e|+:58,#{e|+:#{?#{@min_count},6,0},#{?#{@council},22,0}}}}'
set -g @tabs_squeezed '#{&&:#{e|>:#{n:#{W: #{window_index} #{window_name} |}},#{E:@tabs_room}},#{e|<:#{E:@tabs_room},52}}'
setw -g window-status-separator ""
set -g status-left-length 20
set -g @tab_fmt '#{?#{==:#{@hov},tab#{window_index}},#[bg=#3b4261],}#{?#{@unseen},#{?#{m:*[02468],%S},#[bg=#e0af68#,fg=#1a1b26#,bold],#[fg=#e0af68#,bold]},} #I #{?#{m:*1*,#{P:#{@busy}}},#[underscore],}#W#[nounderscore] #{?window_end_flag,,#[default]#[fg=#565f89]|#[default]}'
set -g @tab_cur_fmt '#[bg=#bb9af7,fg=#1a1b26,bold] #I #{?#{m:*1*,#{P:#{@busy}}},#[underscore],}#W#[nounderscore] #{?window_end_flag,,#[default]#[fg=#565f89]|#[default]}'
set -g @tab_drop_fmt '#[bg=#bb9af7,fg=#1a1b26,bold] ▾ #I #{?#{m:*1*,#{P:#{@busy}}},#[underscore],}#W#[nounderscore] #[default]#{?#{e|<:#{E:@tabs_room},36},,#[fg=#565f89] · #{session_windows} tabs}#{?#{W:#{@unseen}},#{?#{m:*[02468],%S},#[fg=#e0af68#,bold] ●,#[fg=#565f89] ●},} #[default]'
setw -g window-status-format "#{?#{E:@tabs_squeezed},,#{E:@tab_fmt}}"
setw -g window-status-current-format "#{?#{E:@tabs_squeezed},#{E:@tab_drop_fmt},#{E:@tab_cur_fmt}}"
# Looking at a tab clears its blink; drop back to 5s once no tab has @unseen
set-hook -g session-window-changed 'set -wu @unseen ; if -F "#{W:#{@unseen}}" "set -g status-interval 2" "set -g status-interval 5"'
set-hook -g client-attached 'set -wu @unseen ; if -F "#{W:#{@unseen}}" "set -g status-interval 2" "set -g status-interval 5"'
set-hook -g window-unlinked 'if -F "#{W:#{@unseen}}" "set -g status-interval 2" "set -g status-interval 5"'
# Header: one line on top of every pane carrying the AFC bar for that pane's own agent
# ([LLM / account] [model · effort] [plan limits] [CPU / RAM] [Fleet]). It used to sit at the right of the bottom
# bar, where it squeezed the tabs.
set -g status-right-length 105
# Right of the bottom bar: the tab buttons first (nearest the tabs), then machine CPU / RAM and the
# fleet's count and memory (afc-bar --machine), moved here from the pane headers since they are the
# same for every pane, then ▣, ⚙ settings and + add when they apply.
# The buttons are clicked with the mouse: ◀ and ▶ move to the previous / next tab. Each button is
# a user range (MUST stay ≤15 chars: tmux truncates range=user|NAME at 15 chars!); the click handler
# below reads which one was hit. A click on a tab still selects it.
set -g status-right "#[range=user|prev]#{?#{==:#{@hov},prev},#[fg=#1a1b26#,bg=#7aa2f7],#[bg=#24283b#,fg=#c0caf5]} ◀ #[norange,default] #[range=user|next]#{?#{==:#{@hov},next},#[fg=#1a1b26#,bg=#7aa2f7],#[bg=#24283b#,fg=#c0caf5]} ▶ #[norange,default] #(~/.local/bin/afc-bar --machine)#[default] #{?#{@min_count},#[range=user|restore]#{?#{==:#{@hov},restore},#[fg=#1a1b26#,bg=#7aa2f7],#[bg=#e0af68#,fg=#1a1b26#,bold]} ▣ #{@min_count} #[norange#,default] ,}#{?#{@council},#[range=user|council_cfg]#{?#{==:#{@hov},council_cfg},#[fg=#1a1b26#,bg=#7aa2f7],#[bg=#24283b#,fg=#7dcfff#,bold]} ⚙ settings #[norange#,default] #[range=user|council_add]#{?#{==:#{@hov},council_add},#[fg=#1a1b26#,bg=#7aa2f7],#[bg=#bb9af7#,fg=#1a1b26#,bold]} + add #[norange#,default] ,}"
set -s user-keys[0] "\e[99~"
set -s user-keys[1] "\e[98~"
set -s user-keys[2] "\e[97~"
set -s user-keys[3] "\e[96~"   # Alt+W from Alacritty (see M-w below)
bind -n User0 run-shell -b '~/.local/bin/afc-menu --open "#{socket_path}" "#{client_name}" "#{window_id}" "#{pane_id}" "#{pane_pid}" "#{pane_current_path}" "#{session_name}"'
bind -n User1 if -F '#{||:#{@council_chat},#{@council_member}}' { run-shell -b '~/.local/bin/afc-council --end-all "#{window_id}" "#{pane_id}"' } {}
bind -n User2 if -F '#{||:#{@council_chat},#{@council_member}}' { run-shell -b '~/.local/bin/afc-council --restart-wipe "#{window_id}" "#{pane_id}"' } {}
bind -n M-Escape run-shell -b '~/.local/bin/afc-menu --open "#{socket_path}" "#{client_name}" "#{window_id}" "#{pane_id}" "#{pane_pid}" "#{pane_current_path}" "#{session_name}"'
bind -n MouseDown1StatusLeft run-shell -b '~/.local/bin/afc-menu --open "#{socket_path}" "#{client_name}" "#{window_id}" "#{pane_id}" "#{pane_pid}" "#{pane_current_path}" "#{session_name}"'
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},acf_menu}' { run-shell -b '~/.local/bin/afc-menu --open "#{socket_path}" "#{client_name}" "#{window_id}" "#{pane_id}" "#{pane_pid}" "#{pane_current_path}" "#{session_name}"' } { if -F '#{==:#{mouse_status_range},council_cfg}' { run-shell -b '~/.local/bin/afc-council --open-settings "#{client_name}" "#{window_id}" settings' } { if -F '#{==:#{mouse_status_range},council_add}' { run-shell -b '~/.local/bin/afc-council --add-menu "#{client_name}" "#{window_id}"' } { if -F '#{==:#{mouse_status_range},prev}' { previous-window } { if -F '#{==:#{mouse_status_range},next}' { next-window } { if -F '#{==:#{mouse_status_range},restore}' { run-shell -b '~/.local/bin/afc-min show "#{client_name}" "#{window_id}"' } { if -F '#{&&:#{==:#{mouse_status_range},window},#{E:@tabs_squeezed}}' { run-shell -b '~/.local/bin/agents --tab-menu "#{client_name}"' } { select-window -t = } } } } } } }
# Minimised splits: ▣ N shows in the bottom bar only while N splits are minimised; click it to
# bring one back (a list when there are several). Key: Alt+U. A split returns to the tab it came
# from, on the right. The minimise and close buttons themselves are in each pane header.
# Alt+Z still zooms the focused split to the whole tab and back; that is separate from this.
bind -n M-h run-shell -b '~/.local/bin/afc-min hide "#{pane_id}"'
bind -n M-u run-shell -b '~/.local/bin/afc-min show "#{client_name}" "#{window_id}"'
# A split that works in its own folder (a git worktree, made from the split menu) shows its branch
# after the header figures, as ⎇ acf/<project>-<n>: the pane option @wt, set by `agents --pane`.
# In a TokenOps project the header also shows the rule check of the last turn (afc-rules sets
# @rules and its colour @rules_c): ✓ rules, △ N notes, or ✗ N rules. The figures give it room.
setw -g pane-border-status top
setw -g pane-border-format " #{?#{@agent},#[fg=#bb9af7#,bold]@#{@agent}#[nobold#,fg=default] ,}#{?#{==:#{@collab},on},#[fg=#9ece6a]⇄#[fg=default] ,}#(~/.local/bin/afc-bar #{pane_pid} #{pane_id} #{e|-:#{pane_width},#{e|+:#{?#{@rules},26,15},#{?#{@agent},#{?#{==:#{@collab},on},10,8},0}}} 0#{@hdr_page})#[default]#{?#{@wt}, #[fg=#e0af68]⎇ #{@wt}#[default],}#{?#{@rules}, #[fg=#{@rules_c}]#{@rules}#[default],}#[align=right]#[fg=#565f89] [#{?#{||:#{@council_chat},#{@council_member}},,#{?#{==:#{@hbtn},#{pane_id}:new},#[fg=#1a1b26#,bg=#7aa2f7],#[fg=#a9b1d6#,bg=default]}+#[bg=default] }#{?#{==:#{@hbtn},#{pane_id}:move},#[fg=#1a1b26#,bg=#7aa2f7],#[fg=#a9b1d6#,bg=default]}↔#[bg=default] #{?#{==:#{@hbtn},#{pane_id}:min},#[fg=#1a1b26#,bg=#7aa2f7],#[fg=#a9b1d6#,bg=default]}–#[bg=default] #{?#{==:#{@hbtn},#{pane_id}:max},#[fg=#1a1b26#,bg=#7aa2f7],#{?window_zoomed_flag,#[fg=#e0af68#,bg=default],#[fg=#a9b1d6#,bg=default]}}#{?window_zoomed_flag,⧉,□}#[bg=default] #{?#{==:#{@hbtn},#{pane_id}:close},#[fg=#1a1b26#,bg=#7aa2f7],#[fg=#a9b1d6#,bg=default]}✕#[fg=#565f89,bg=default]] "
# When a tab's layout changes (a split is maximised, minimised, closed, restored or dragged) or the
# window itself is resized, Claude panes whose width changed are told to redraw (afc-reflow).
# Without it a maximised Claude kept its chat in the old narrow column: in classic mode Claude
# does not re-wrap what it has already printed.
set-hook -g window-layout-changed "run-shell -b '~/.local/bin/afc-reflow #{hook_window}'"
set-hook -g window-resized "run-shell -b '~/.local/bin/afc-reflow #{hook_window}'"
# Agent names: every pane gets a short random name (@agent, shown as @fox at the left of its header)
# when it opens, and every pane already open gets one when this file is read. Type @fox in another
# agent's prompt to hand it fox's screen; /collab lets the agents of one tab message each other
# (lib/afc/collab.py, bin/afc-collab; the prompt hook of afc-rules does the @name and /collab part).
set-hook -g after-split-window "run-shell -b '[ -x ~/.local/bin/afc-collab ] && ~/.local/bin/afc-collab name --all || true'"
set-hook -g after-new-window "run-shell -b '[ -x ~/.local/bin/afc-collab ] && ~/.local/bin/afc-collab name --all || true'"
run-shell -b '[ -x ~/.local/bin/afc-collab ] && ~/.local/bin/afc-collab name --all || true'

# Hover: whatever is clickable lights up under the pointer (header buttons, tab names, the bottom
# bar's buttons). tmux normally neither asks the terminal for mouse movement nor lets a move be
# bound; the 3.8 in ~/.local/opt is patched for both (afc-thin-scrollbar.patch): @mouse-hover on
# turns movement reports on, and MouseMoveStatus / MouseMoveBorder / MouseMovePane can be bound.
# The thing under the pointer is kept in @hov (bottom bar: prev, next, restore, tab<N>) and @hbtn
# (a header button: <pane id>:min|max|close); the formats above and below colour by them. An
# option is only written when the hovered thing changes, so moving the mouse costs next to nothing.
set -g @mouse-hover on
set -g @hov ""
set -g @hbtn ""
bind -n MouseMoveStatus if -F '#{!=:#{@hov},#{?#{==:#{mouse_status_range},window},tab#{window_index},#{mouse_status_range}}}' { set -g -F @hov '#{?#{==:#{mouse_status_range},window},tab#{window_index},#{mouse_status_range}}' } \; if -F '#{!=:#{@hbtn},}' { set -g @hbtn '' }
bind -n MouseMoveBorder if -F '#{!=:#{@hbtn},#{?#{&&:#{==:#{mouse_y},#{e|-:#{pane_top},1}},#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},10}},#{pane_id}:#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},2},close,#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},4},max,#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},6},min,#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},8},move,new}}}},}}' { set -g -F @hbtn '#{?#{&&:#{==:#{mouse_y},#{e|-:#{pane_top},1}},#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},10}},#{pane_id}:#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},2},close,#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},4},max,#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},6},min,#{?#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},8},move,new}}}},}' } \; if -F '#{!=:#{@hov},}' { set -g @hov '' }
bind -n MouseMovePane if -F '#{||:#{!=:#{@hov},},#{!=:#{@hbtn},}}' { set -g @hov '' ; set -g @hbtn '' }

# Each pane header ends with a small boxed set of buttons for THAT pane:  [+ ↔ – □ ✕]
#   + new chat: a new split on the right with the same agent on a new chat: same tool, account, mode
#     and folder; this split keeps its chat (agents --new-chat; Alt+W does the focused one). Not on council panes.
#   ↔ move: a pop-up to trade places with the split on the left / right / above / below, to merge
#     it under a neighbour (sharing that column), or to give it a column of its own again
#     (afc-move; Alt+J does the focused one)
#   – minimise (afc-min; Alt+H does the focused one). A dash, not ▁: it sits mid-height like □ and ✕
#   □ maximise: the pane fills the whole tab and the other splits are hidden behind it (Alt+Z).
#     While maximised the button shows as an amber ⧉: click it to bring the other splits back.
#   ✕ close (the same question as Alt+Q: close, minimise instead, or keep)
# Telling them apart needs the column and row of a click on a border, which stock tmux does not
# report: the 3.8 in ~/.local/opt carries a patch for that (mouse_x / mouse_y on borders, in
# afc-thin-scrollbar.patch). Counting columns from the right end of the header: the last 4 close,
# then 2 maximise, 2 minimise, 2 move, 2 new chat; a click anywhere else on the header turns its page.
bind -n M-j run-shell -b '~/.local/bin/afc-move menu "#{client_name}" "#{pane_id}"'
# Alt+W: the + button for the focused split (a new split beside it: same agent, new chat).
# A council pane gets the key itself, as Alt+W did before.
bind -n M-w if -F '#{||:#{@council_chat},#{@council_member}}' { send-keys M-w } { run-shell -b '~/.local/bin/agents --new-chat "#{pane_id}"' }
# The same with Caps Lock on (tmux then sees M-W). M-W was free.
bind -n M-W if -F '#{||:#{@council_chat},#{@council_member}}' { send-keys M-W } { run-shell -b '~/.local/bin/agents --new-chat "#{pane_id}"' }
# Alacritty sends Alt+W as user-keys[3] (alacritty.toml), so this is the one a keypress reaches.
bind -n User3 if -F '#{||:#{@council_chat},#{@council_member}}' { send-keys M-w } { run-shell -b '~/.local/bin/agents --new-chat "#{pane_id}"' }
# A header too long for its pane (splits) is dealt into pages that fit, shown behind a marker
# like "◀ 1/2 ▶". Click the header to turn to the next page (it wraps round); right-click goes
# back; the wheel over the header does both. The page is the pane option @hdr_page. tmux says
# which pane's header was clicked but not where on it, so the two arrows cannot be separate
# buttons: the whole header line is the button. Bound to button release, so dragging a border
# to resize a split does not turn the page.
bind -n MouseUp1Border if -F '#{&&:#{==:#{mouse_y},#{e|-:#{pane_top},1}},#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},#{?#{@council_chat},9,2}}}' { select-pane -t = ; if -F '#{@council_one}' { run-shell -b '~/.local/bin/afc-council --one-menu "#{client_name}" "#{pane_id}"' } { if -F '#{@council_perm_judge}' { display-menu -M -x C -y C -T "#[align=centre] 🔒 @#{?#{@council_name},#{@council_name},supra-omnia} is the permanent final judge " "Switch Judge provider & model…" m "run-shell -b '~/.local/bin/afc-council --open-settings \"#{client_name}\" \"#{window_id}\" bp_role:JUDGE'" "" "Close menu" n "" } { display-menu -M -x C -y C -T "#[align=centre] #{?#{@council_chat},Close the council? (saved: Alt+K opens it again),#{?#{@council_member},#{?#{@council_one},Back to one pane per member?,#{?#{@council_what},#{@council_what},Remove} @#{?#{@council_name},#{@council_name},#{@council_member}}#{?#{==:#{@council_what},Delete agent}, for good,} from the council?},#{?#{&&:#{==:#{window_panes},1},#{@project}},Close #{@project} for good (off the fleet list)?,Close this split?}}} " "Yes, close it" y "run-shell '~/.local/bin/agents --close #{pane_id}'" "#{?#{||:#{@council_chat},#{||:#{@council_member},#{==:#{window_panes},1}}},-,}Minimise it instead" m "run-shell -b '~/.local/bin/afc-min hide #{pane_id}'" "No, keep it" n "" } } } { if -F '#{||:#{@council_chat},#{@council_member}}' { select-pane -t = } { if -F '#{&&:#{==:#{mouse_y},#{e|-:#{pane_top},1}},#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},4}}' { select-pane -t = ; resize-pane -Z } { if -F '#{&&:#{==:#{mouse_y},#{e|-:#{pane_top},1}},#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},6}}' { run-shell -b '~/.local/bin/afc-min hide "#{pane_id}"' } { if -F '#{&&:#{==:#{mouse_y},#{e|-:#{pane_top},1}},#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},8}}' { run-shell -b '~/.local/bin/afc-move menu "#{client_name}" "#{pane_id}"' } { if -F '#{&&:#{==:#{mouse_y},#{e|-:#{pane_top},1}},#{e|<=:#{e|-:#{e|+:#{pane_left},#{pane_width}},#{mouse_x}},10}}' { run-shell -b '~/.local/bin/agents --new-chat "#{pane_id}"' } { set -p -F @hdr_page '#{e|+:0#{@hdr_page},1}' } } } } } }
bind -n MouseUp3Border set -p -F @hdr_page '#{?#{e|>:0#{@hdr_page},0},#{e|-:0#{@hdr_page},1},0}'
bind -n WheelDownBorder set -p -F @hdr_page '#{e|+:0#{@hdr_page},1}'
bind -n WheelUpBorder set -p -F @hdr_page '#{?#{e|>:0#{@hdr_page},0},#{e|-:0#{@hdr_page},1},0}'
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#7aa2f7,fg=#1a1b26"

# tmux's own menus, centred like every fleet pop-up (operator, 2026-11-24): right-click on a pane,
# on a tab, on the ACF label at the bottom left or on empty space (Alt+right-click too), Ctrl+B <
# and >, and the move menus of a floating pane (Ctrl+B g, then , or .). Copied from tmux 3.8's own
# bindings (tmux list-keys), with only where the menu opens changed to -x C -y C, plus -O: a menu
# that does not open under the pointer would otherwise close as soon as the button comes up.
# The pane menu opens on the release of the right button, not the press: in the middle of the screen it
# is often under the pointer, and the release would close it or run the item there (code review, 2026-11-24).
bind-key  -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { select-pane -t = }
bind-key  -T root MouseUp3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { send-keys -M } { display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x C -y C "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{==:#{pane_mode},copy-mode},#{?copy_line_numbers,Hide Line Numbers,Show Line Numbers},}" L { send-keys -X line-numbers-toggle } "#{?#{==:#{pane_mode},copy-mode},#{?refresh_active,Refresh Off,Refresh On},}" r { send-keys -X refresh-toggle } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{#{pane_floating_flag}},Move,}" '' { display-menu -T "#[align=centre]Move" -x L -y L Centre c { move-pane -P centre } '' "Top Left" 1 { move-pane -P top-left } "Top Right" 2 { move-pane -P top-right } "Bottom Left" 3 { move-pane -P bottom-left } "Bottom Right" 4 { move-pane -P bottom-right } '' Top t { move-pane -P top-centre } Bottom b { move-pane -P bottom-centre } Left l { move-pane -P centre-left } Right r { move-pane -P centre-right } } "#{?#{#{pane_floating_flag}},Move & Resize,}" '' { display-menu -T "#[align=centre]Move & Resize" -x L -y L Fill 0 { resize-pane -x "100%" -y "100%" ; move-pane -P top-left } '' "Top Left" 1 { resize-pane -x "50%" -y "50%" ; move-pane -P top-left } "Top Right" 2 { resize-pane -x "50%" -y "50%" ; move-pane -P top-right } "Bottom Left" 3 { resize-pane -x "50%" -y "50%" ; move-pane -P bottom-left } "Bottom Right" 4 { resize-pane -x "50%" -y "50%" ; move-pane -P bottom-right } '' Top t { resize-pane -x "100%" -y "50%" ; move-pane -P top-centre } Bottom b { resize-pane -x "100%" -y "50%" ; move-pane -P bottom-centre } Left l { resize-pane -x "50%" -y "100%" ; move-pane -P centre-left } Right r { resize-pane -x "50%" -y "100%" ; move-pane -P centre-right } } "#{?#{#{pane_floating_flag}},Tile,}" t { join-pane } "#{?#{!:#{pane_floating_flag}},Float,}" f { break-pane -W } "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
