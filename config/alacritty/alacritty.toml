# Alacritty 0.13 — drawn on the GPU. Tabs and splits come from tmux (~/.tmux.conf).
# Fleet: run `agents`, or the "ACF" entry in the KDE menu.

[window]
padding = { x = 8, y = 6 }
dynamic_padding = true
dimensions = { columns = 140, lines = 40 }

[font]
size = 11.5
normal = { family = "JetBrains Mono", style = "Regular" }

[scrolling]
history = 10000

[mouse]
hide_when_typing = true

# Tokyo Night
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.cursor]
text = "#1a1b26"
cursor = "#c0caf5"

[colors.selection]
text = "CellForeground"
background = "#33467c"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"

# Warnings are not shown as a bar over the fleet (errors still are). The one that kept coming up,
# "Unable to store text in clipboard: Failed to set new owner of XCB selection", is harmless: tmux
# hands every copy to xclip as well, xclip gets there first and the text is on the clipboard.
# This line works only together with the -q the fleet starts its window with (bin/agents):
# Alacritty takes the more talkative of the two.
[debug]
log_level = "Error"

[keyboard]
bindings = [
  { key = "Escape", mods = "Super", chars = "\u001b[99~" },
  { key = "Q", mods = "Super|Alt", chars = "\u001b[98~" },
  { key = "R", mods = "Super|Alt", chars = "\u001b[97~" },
  # Alt+W: new chat beside this split (tmux user-keys[3] -> agents --new-chat). Sent as its own
  # code so no keyboard protocol or input method can turn it into something tmux reads differently.
  { key = "W", mods = "Alt", chars = "\u001b[96~" },
  { key = "W", mods = "Alt|Shift", chars = "\u001b[96~" },
]
