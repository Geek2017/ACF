# Cap all desktop apps in app.slice together so Brave + Chromium + ChatGPT + Claude Desktop
# + Electron stay bounded alongside agents.slice (12G/12.5G) and acchat.slice (2G/2.25G).
# Hard-cap sum: agents 12.5G + app 8.0G + acchat 2.25G = 22.75 GiB <= 23 GiB RAM.
[Slice]
MemoryHigh=7680M
MemoryMax=8G
MemorySwapMax=2G
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
